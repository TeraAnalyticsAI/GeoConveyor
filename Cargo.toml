[package]
name = "geoconveyor"
version = "0.3.1"
edition = "2021"
description = "A native batch-processing GUI for terrio (every command, every option)"

[lib]
name = "geoconveyor"
path = "src/lib.rs"

[[bin]]
name = "geoconveyor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
egui_extras = "0.37"
dirs = "6"
which = "8"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
