# Builds the Linux binary + Flatpak bundle and the Windows installer + portable zip.
# Trigger: push a tag like v0.3.1, or run it by hand from the Actions tab.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04            # glibc 2.39 <= Flatpak runtime 24.08 (2.40)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install terrio       # the tests run the real terrio
      - run: cargo test --release
      - run: cargo build --release
      - name: Flatpak bundle
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          packaging/linux/build-flatpak.sh
      - run: cp target/release/geoconveyor geoconveyor-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            geoconveyor-linux-x86_64
            GeoConveyor-*.flatpak

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install terrio
      - run: cargo test --release
      - run: cargo build --release
      - name: Check the exe needs no Visual C++ runtime DLL
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find '**\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents target\release\geoconveyor.exe
          $deps
          if ($deps -match '(?i)vcruntime|msvcp') {
            Write-Error "geoconveyor.exe imports the Visual C++ runtime; check .cargo/config.toml (crt-static)"; exit 1
          }
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\geoconveyor.iss
          Compress-Archive -Path target\release\geoconveyor.exe, packaging\geoconveyor.ico, README.md -DestinationPath "dist\GeoConveyor-$v-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
